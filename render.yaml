# Render Blueprint — Vision Design frontend.
# Deploys the Vite production build as a static site with an SPA rewrite.
services:
  - type: web
    name: vision-design-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/public
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api-visiondesign.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html